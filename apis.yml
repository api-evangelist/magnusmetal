aid: magnusmetal
name: MagnusMetal
description: >-
  Magnus Metal (MagnusMetal Ltd.) is an Israeli advanced-manufacturing company
  bringing metal casting into the Industry 4.0 era with its patent-pending
  Digital Casting System. Founded in 2017 and headquartered at the Revadim
  Industrial Park in Kibbutz Revadim, Israel, the company builds machines that
  combine additive-manufacturing and casting principles: a slicer designs a
  ceramic mold layer by layer and solid alloy is deposited into each layer, so
  parts are produced from widely available solid metals rather than powders and
  with no hard tooling. The company markets the process for powertrains,
  engines, industrial machinery and structural components, claiming removal of
  6-18 weeks of tooling lead time, up to 70% raw-material savings and roughly
  50% lower energy use. Magnus Metal is a hardware and materials manufacturer -
  it sells castings and casting systems, not software - and publishes no public
  developer program, API, SDK or machine-readable contract of any kind.
